<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open-source portfolio template built with React, Vite & Tailwind CSS. Animated, config-driven, dark/light theme." />
    <!-- Open Graph -->
    <meta property="og:title" content="DevFolio — Open Source Portfolio Template" />
    <meta property="og:description" content="A clean, animated, config-driven portfolio. Fork it and make it yours in minutes." />
    <meta property="og:url" content="https://dev-folio-bay.vercel.app/" />
    <meta property="og:type" content="website" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevFolio — Open Source Portfolio" />
    <meta name="twitter:description" content="Animated React portfolio. Fork &amp; customize in minutes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>DevFolio — Open Source Portfolio Template</title>
    <script>
      (function() {
        var t = localStorage.getItem('portfolio-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
